# Weekly dependency updates. The actions group keeps the workflow versions
# together; Go major bumps stay separate so they can be reviewed one at a time.
# Workflows pin actions by commit SHA with the version in a trailing comment.
# Dependabot updates the SHA and the comment together, so keep them on one line.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # libp2p's last major tag, v6.0.23+incompatible, is an old tree without
      # the packages we import. Releases are v0.x now, so treat a major bump
      # as something to do by hand, not as a routine update.
      - dependency-name: github.com/libp2p/go-libp2p
        update-types: ["version-update:semver-major"]

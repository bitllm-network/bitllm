# Weekly dependency updates. The actions group keeps the workflow versions
# together; Go major bumps stay separate so they can be reviewed one at a time.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

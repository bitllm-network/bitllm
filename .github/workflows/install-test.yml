# Runs the public one-line installers from bitllm.org on fresh machines, the
# way a newcomer (or their agent) would, then starts the node and waits for
# the local API. The installers follow releases/latest, which skips prereleases,
# so "released" is the run that tests a new version: it fires when a prerelease
# is promoted. A run for a published prerelease still gets the previous version,
# so the version check below is skipped for prereleases and manual runs. It runs
# before the node starts, since a running node may update itself.
name: install-test
on:
  workflow_dispatch:
  release:
    types: [published, released]
permissions:
  contents: read
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: install
        run: curl -fsSL https://bitllm.org/install.sh | sh
      - name: the installed version is the release tag
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          got=$(~/.local/bin/bitllm --version)
          echo "$got"
          test "$got" = "bitllm $TAG"
      - name: start and wait for the API
        run: |
          nohup ~/.local/bin/bitllm --mdns=false --upnp=false > bitllm.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:7778/status > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:7778/status
          sleep 20
          curl -s http://127.0.0.1:7778/v1/models; echo
      - if: always()
        run: cat bitllm.log || true
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: install
        shell: powershell
        run: irm https://bitllm.org/install.ps1 | iex
      - name: install (PowerShell 7)
        shell: pwsh
        run: irm https://bitllm.org/install.ps1 | iex
      - name: the installed version is the release tag
        if: github.event_name == 'release' && !github.event.release.prerelease
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $got = & "$env:LOCALAPPDATA\bitllm\bitllm.exe" --version
          Write-Output $got
          if ($got -ne "bitllm $env:TAG") { throw "installed '$got', want 'bitllm $env:TAG'" }
      - name: start and wait for the API
        shell: pwsh
        run: |
          Start-Process -WindowStyle Hidden "$env:LOCALAPPDATA\bitllm\bitllm.exe" -ArgumentList "--mdns=false","--upnp=false"
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { try { Invoke-RestMethod http://127.0.0.1:7778/status | Out-Null; $ok = $true; break } catch { Start-Sleep 1 } }
          if (-not $ok) { throw "gateway never answered" }
          Invoke-RestMethod http://127.0.0.1:7778/status | ConvertTo-Json -Depth 2
          Start-Sleep 20
          Invoke-RestMethod http://127.0.0.1:7778/v1/models | ConvertTo-Json -Depth 4

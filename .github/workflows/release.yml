# Runs when a release tag is pushed. It tests the tag, builds the four release
# binaries, checks the asset contract and leaves everything in a draft
# prerelease. An admin signs SHA256SUMS offline and publishes by hand; see
# docs/releasing.md. This workflow holds no signing key and never publishes.
name: release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # Only the last step needs the write token, so it is not left in git's
      # config for the steps that run the code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Without -race: the binaries are built without it, and pull requests and
      # main already run the race detector. A tag should not wait on that twice.
      - run: go test -count=1 ./...
      - name: build release assets
        run: scripts/release.sh "$TAG"
      - name: check the release contract
        run: |
          test "$(dist/bitllm-linux-amd64 --version)" = "bitllm $TAG"
          (cd dist && sha256sum -c SHA256SUMS)
          for f in bitllm-darwin-arm64 bitllm-linux-amd64 bitllm-linux-arm64 bitllm-windows-amd64.exe SHA256SUMS; do
            test -s "dist/$f" || { echo "missing or empty dist/$f"; exit 1; }
          done
      - name: create the draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/bitllm-* dist/SHA256SUMS --draft --prerelease --verify-tag --title "$TAG" --generate-notes
